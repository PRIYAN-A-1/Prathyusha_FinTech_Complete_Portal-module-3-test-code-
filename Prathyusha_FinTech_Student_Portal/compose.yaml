services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U fintech -d fintech
      interval: 5s
      retries: 15
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://fintech:${DB_PASSWORD}@db:5432/fintech
    command:
    - node
    - src/migrate.js
    depends_on:
      db:
        condition: service_healthy
  auth:
    build: ./auth
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/fintech
      DB_USER: fintech
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://fintech:${DB_PASSWORD}@db:5432/fintech
      AUTH_URL: http://auth:8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
    - 127.0.0.1:4000:4000
    volumes:
    - private-uploads:/app/private-uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
    - 127.0.0.1:8088:80
    depends_on:
      api:
        condition: service_started
      auth:
        condition: service_started
volumes:
  postgres-data: null
  private-uploads: null
